<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="../styles/global.css"> 
    <link rel="stylesheet" href="../styles/reset.css"> 
    <link rel="stylesheet" href="../styles/variables.css"> 
</head>
<body>
    <div class="chat-container">
        
        <!-- FLEXBOX SIDEBAR PANEL -->
        <aside class="sidebar">
            <div class="rooms-section">
                <h2>Chat Rooms</h2>
                <ul id="roomList" class="room-list">
                    <li class="active">General</li>
                    <li class="active">Developer</li>
                    <li class="active">Random</li>
                </ul>
            </div>
            <div class="users-section">
                <h2>Active Users</h2>
                <ul id="userList" class="user-list">
                    <li>User-1</li>
                    <li>User-2</li>
                </ul>
            </div>
        </aside>

        <!-- FLEXBOX MAIN PANEL INTERFACE -->
        <main class="chat-main">
            <header>
                <h2 id="roomTitle">General Chat</h2>
                <div class="sidebar-footer">
                    <button id="logoutBtn" class="btn-logout">Log Out</button>
                </div>
            </header>

            <section class="chat-body">

                <!-- GRID MESSAGE CONTAINER AREA -->
                <section id="messageArea" class="message-area">
                    
                    <!-- Received Message Bubble (Grid Alignment) -->
                    <div class="message received">
                        <div class="message-grid-wrapper">
                            <div class="msg-avatar">A</div>
                            <div class="msg-sender">User-1</div>
                            <div class="msg-text">Hey!</div>
                            <div class="msg-time">02:45 PM</div>
                        </div>
                    </div>

                    <!-- Sent Message Bubble (Grid Alignment) -->
                    <div class="message sent">
                        <div class="message-grid-wrapper">
                            <div class="msg-avatar">B</div>
                            <div class="msg-sender">You</div>
                            <div class="msg-text">Hello!</div>
                            <div class="msg-time">02:47 PM</div>
                        </div>
                    </div>

                </section>

                <div id="typingIndicator" class="typing-indicator" style="display: none;">
                    <span id="typingText">User is typing...</span>
                </div>
            </section>

            <!-- FLEXBOX COMPACT FOOTER INPUT BAR -->
            <footer>
                <form id="chatForm" class="chat-input-bar">
                    <input type="text" id="msgInput" placeholder="Type message..." required autocomplete="off">
                    <button type="submit" id="sendBtn">Send</button>
                </form>
            </footer>
        </main>
    </div>
</body>
</html>
