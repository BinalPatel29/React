<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/variables.css">
</head>
<body>
    <div class="page-wrapper">

        <div class="notes-card">
            <h1>Register Here!</h1>

            <div id="errorMessage"></div>
            <div id="successMessage"></div>
        
            <form id = "registerForm">
   
                <div class="name-row">
                    <div class="form-group">
                        <label for="fname">FirstName:</label>
                        <input type="text" id="fname" placeholder="Enter your first name" required>
                    </div>

                    <div class="form-group">
                        <label for="lname">LastName:</label>
                        <input type="text" id="lname" placeholder="Enter your last name" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email:</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-password" >Password:</label>
                        <input type="password" id="password" name="password" minlength="6" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group">
                        <label for="mobno">Mobile No:</label>
                        <input type="tel" id="mobno" maxlength="10" pattern="[0-9]{10}" placeholder="Enter your phone number">
                    </div>
                    
                </div>

                <input type="submit" class="add-btn" value="Register">
   
            </form>
    
            <p>Already have an account? <a href="/html/index.html">Login here</a></p>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script> 

</body>
</html>
